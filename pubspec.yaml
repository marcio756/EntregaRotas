name: pao_rota_app
description: Aplicação Offline-First para otimização de rotas de entrega.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management & Architecture
  flutter_riverpod: ^2.4.9
  # Offline-First Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.1
  # Geolocation & Maps
  geolocator: ^10.1.0
  # UI & Premium Animations (Transitions)
  flutter_animate: ^4.2.0
  google_fonts: ^6.1.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  image_picker: ^1.2.2
  screenshot: ^3.0.0
  flutter_google_street_view: ^3.1.4
  flutter_map_marker_cluster: ^8.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  isar_generator: ^3.1.0+1
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true